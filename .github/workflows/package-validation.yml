
name: Community SDK Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-validation:
    name: Build and Validate Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Validate package contents and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          assert len(wheels) == 1, f"Expected one wheel, found {len(wheels)}"
          assert len(sdists) == 1, f"Expected one sdist, found {len(sdists)}"

          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()

              required = [
                  "jas_si_community_python/__init__.py",
                  "jas_si_community_python/client.py",
              ]

              for item in required:
                  assert item in names, f"Missing wheel file: {item}"

              license_files = [
                  name for name in names
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert license_files, "Apache LICENSE missing from wheel"

              metadata_files = [
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              ]
              assert len(metadata_files) == 1

              metadata = wheel.read(metadata_files[0]).decode()

              assert "Version: 0.1.1" in metadata
              assert "Requires-Python: >=3.10" in metadata
              assert "License-Expression: Apache-2.0" in metadata

          with tarfile.open(sdists[0], "r:gz") as archive:
              source_files = archive.getnames()
              assert any(
                  name.endswith("/LICENSE") or name == "LICENSE"
                  for name in source_files
              ), "LICENSE missing from source distribution"

          print("Wheel contents and metadata validated.")
          print("Source distribution LICENSE validated.")
          PY

      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/sdk-wheel-venv"
          "$RUNNER_TEMP/sdk-wheel-venv/bin/python" -m pip install dist/*.whl

      - name: Smoke-test installed package
        run: |
          "$RUNNER_TEMP/sdk-wheel-venv/bin/python" - <<'PY'
          from jas_si_community_python import (
              JASSIClient,
              JASSIError,
              __version__,
          )

          assert __version__ == "0.1.1"

          client = JASSIClient(base_url="http://localhost:8000")
          client.close()

          print("Installed SDK version:", __version__)
          print("Isolated wheel installation passed.")
          PY
